<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Artinder</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS: standalone mode (skjuler adresselinjen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Artinder" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Android: tema-farve på browser-chrome -->
    <meta name="theme-color" content="#FF4458" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Forhindrer callout og selection på touch -->
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
